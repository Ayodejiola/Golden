[project]
name = "harborline-platform-catalog-mcp"
version = "1.0.0"
description = "Read-only MCP server exposing Harborline platform context (catalog, runbooks, ADRs, golden path)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["S101"]
