[project]
name = "claims-worker"
version = "0.1.0"
description = "Harborline claims triage worker (Service Bus consumer)"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "azure-identity>=1.19,<2",
  "azure-servicebus>=7.13,<8",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
  "opentelemetry-instrumentation-psycopg>=0.49b0",
  "opentelemetry-instrumentation-logging>=0.49b0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "S", "UP", "SIM", "RUF"]
ignore = ["S101"]   # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.coverage.run]
source = ["src"]
# I/O adapters are exercised by the integration job (real PostgreSQL) in .github/workflows/app-*.yml.
omit = ["src/claims_worker/main.py", "src/claims_worker/store.py"]
