# Unprivileged NGINX for a read-only root filesystem: every writable path lives in /tmp (emptyDir).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"path":"$uri","bytes":$body_bytes_sent,"duration":$request_time,'
                              '"correlation_id":"$http_x_correlation_id","ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Rendered at start-up from /etc/nginx/templates/*.template by the image entrypoint (envsubst).
  include /tmp/*.conf;
}
