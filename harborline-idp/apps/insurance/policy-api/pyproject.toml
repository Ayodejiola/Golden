[project]
name = "policy-api"
version = "0.1.0"
description = "Harborline Policy Portal — quotes, policies and first notice of loss (FNOL) API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "azure-identity>=1.19,<2",
  "azure-servicebus>=7.13,<8",
  "pyjwt[crypto]>=2.10,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-psycopg>=0.49b0",
  "opentelemetry-instrumentation-logging>=0.49b0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real PostgreSQL (RUN_INTEGRATION=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "S", "UP", "SIM", "RUF"]
ignore = ["S101"]   # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.coverage.run]
source = ["src"]
# I/O adapters are exercised by the integration job (real PostgreSQL) in .github/workflows/app-*.yml.
omit = ["src/policy_api/main.py", "src/policy_api/db.py", "src/policy_api/repository.py", "src/policy_api/routers/*", "src/policy_api/security.py", "src/policy_api/migrate.py", "src/policy_api/telemetry.py"]
