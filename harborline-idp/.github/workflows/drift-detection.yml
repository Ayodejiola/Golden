# Nightly drift detection: plan every stack with the read-only identity; any diff fails the job and opens an issue.
name: drift-detection

on:
  schedule:
    - cron: "37 9 * * *"   # 05:37 Atlantic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stack: management, env: shared }
          - { stack: connectivity, env: shared }
          - { stack: platform, env: dev }
          - { stack: workload-insurance, env: dev }
          - { stack: platform, env: stg }
          - { stack: workload-insurance, env: stg }
          - { stack: platform, env: prod }
          - { stack: workload-insurance, env: prod }
    uses: ./.github/workflows/_terraform-run.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      stack: ${{ matrix.stack }}
      env: ${{ matrix.env }}
      mode: drift

  report:
    needs: drift
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Infrastructure drift detected ${new Date().toISOString().slice(0, 10)}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ ...context.repo, title, labels: ['drift', 'sre'],
              body: `Nightly plan found changes not in Git. Review the run summary: ${run}\n\nRunbook: docs/operations/day2-operations.md#drift` });
