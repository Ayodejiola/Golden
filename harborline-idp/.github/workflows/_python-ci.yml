name: _python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
      coverage-threshold:
        type: number
        default: 80

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install --require-hashes -r requirements.lock; else pip install -r requirements.txt; fi
          pip install pytest pytest-cov ruff mypy
      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Unit tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }} --junitxml=junit.xml
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/junit.xml
