# Docs are code: lint Markdown, build the TechDocs (MkDocs) site in strict mode, render Mermaid diagrams.
name: docs

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "**/*.md", .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10" "mkdocs-techdocs-core>=1.4,<2"
      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.43.0 "**/*.md" --ignore node_modules --ignore "backstage/templates/**/skeleton/**"
      - name: Build TechDocs site (strict)
        run: mkdocs build --strict
      - name: ADR index is complete
        run: |
          for f in docs/adr/[0-9][0-9][0-9][0-9]-*.md; do
            n=$(basename "$f"); grep -q "$n" docs/adr/index.md || { echo "::error::$n missing from docs/adr/index.md"; exit 1; }
          done
