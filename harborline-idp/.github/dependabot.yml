version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/stacks/*
      - /infra/terraform/modules/*
    schedule: { interval: weekly }
    groups:
      azure-providers: { patterns: ["hashicorp/azurerm", "azure/azapi", "hashicorp/azuread"] }
    commit-message: { prefix: "chore(tf)" }

  - package-ecosystem: pip
    directories:
      - /apps/insurance/policy-api
      - /apps/insurance/claims-worker
      - /ai/mcp-servers/platform-catalog
    schedule: { interval: weekly }
    groups:
      opentelemetry: { patterns: ["opentelemetry-*"] }
      azure-sdk: { patterns: ["azure-*"] }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: npm
    directories:
      - /apps/insurance/web
      - /backstage
    schedule: { interval: weekly }
    groups:
      backstage: { patterns: ["@backstage/*"] }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker
    directories:
      - /apps/insurance/policy-api
      - /apps/insurance/claims-worker
      - /apps/insurance/web
      - /backstage
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(image)" }
