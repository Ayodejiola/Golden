{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gs.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.keyVaultCertificateUri }}
    kubernetes.azure.com/tls-cert-keyvault-uri: {{ . | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.keyVaultCertificateUri }}
  tls:
    - hosts:
        - {{ required "ingress.host is required" .Values.ingress.host | quote }}
      secretName: keyvault-{{ include "gs.fullname" . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "gs.fullname" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
