{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "gs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gs.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required for Key Vault access" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "secrets.keyVaultName is required" .Values.secrets.keyVaultName | quote }}
    tenantId: {{ required "secrets.tenantId is required" .Values.secrets.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secrets.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ default "secret" .type }}
        {{- end }}
{{- end }}
