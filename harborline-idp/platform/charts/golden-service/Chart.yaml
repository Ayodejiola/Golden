apiVersion: v2
name: golden-service
description: >-
  Harborline golden-path chart. Every service on the platform deploys with this chart: restricted pod security,
  workload identity, OpenTelemetry wiring, autoscaling (HPA or KEDA), zone spreading, PDB, default-deny network
  policy, internal ingress with Key Vault TLS, and Argo CD-hooked database migrations.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.30.0-0"
keywords: [harborline, golden-path, platform]
maintainers:
  - name: Platform Engineering
    email: platform-engineering@harborline.example
annotations:
  harborline.io/contract: "values.schema.json is the platform contract; breaking changes bump the major version"
