apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Sigstore signatures and SLSA provenance
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Tenant images must be signed keyless by a Harborline GitHub Actions workflow on the main branch and carry
      a SLSA v1 provenance attestation. Kyverno authenticates to ACR with workload identity (AcrPull).
    harborline.io/controls: "NIST-PR.PS-02 NIST-GV.SC-07 SLSA-L3"
spec:
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: verify-signature-and-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  harborline.io/tenant: "true"
      verifyImages:
        - imageReferences:
            - "acrhblmgmtsharedcac01.azurecr.io/*"
          failureAction: Enforce
          mutateDigest: true
          verifyDigest: true
          required: true
          imageRegistryCredentials:
            helpers: [azure]
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/harborline/[A-Za-z0-9_.-]+/\\.github/workflows/[A-Za-z0-9_.-]+\\.ya?ml@refs/heads/main$"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subjectRegExp: "^https://github\\.com/harborline/[A-Za-z0-9_.-]+/\\.github/workflows/[A-Za-z0-9_.-]+\\.ya?ml@refs/heads/main$"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/harborline/*"
