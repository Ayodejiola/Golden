apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-tenant-defaults
  annotations:
    policies.kyverno.io/title: Generate default-deny network policy for tenant namespaces
    policies.kyverno.io/category: Multi-tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Backstop for GitOps tenant onboarding: any namespace labelled as a tenant gets a default-deny
      NetworkPolicy that Kyverno keeps in sync (CIS AKS 5.4.4, zero-trust east-west).
    harborline.io/controls: "CIS-5.4.4 NIST-PR.IR-01"
spec:
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  harborline.io/tenant: "true"
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Ingress, Egress]
