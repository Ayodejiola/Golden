apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.team }}
  labels:
    harborline.io/tenant: "true"
    harborline.io/team: ${{ values.team }}
    harborline.io/cost-center: ${{ values.costCenter }}
    harborline.io/data-classification: ${{ values.dataClassification }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
