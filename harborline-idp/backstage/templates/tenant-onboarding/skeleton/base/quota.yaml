apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: ${{ values.team }}
spec:
  hard:
    requests.cpu: "${{ values.cpu }}"
    requests.memory: ${{ values.memoryGi }}Gi
    limits.memory: ${{ values.memoryGi * 2 }}Gi
    pods: "100"
    persistentvolumeclaims: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: ${{ values.team }}
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { memory: 256Mi }
      max: { memory: 4Gi }
