apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ values.team }}-debug
  namespace: ${{ values.team }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harborline-tenant-debug
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ${{ values.groupId }}
