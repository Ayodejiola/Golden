apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-api-service
  title: Python API service (FastAPI)
  description: >-
    Production-ready FastAPI service on the Harborline golden path: CI with tests and scans, signed images,
    OpenTelemetry, health probes, TechDocs, catalog entry, and a dev deployment via GitOps — in about two minutes.
  tags: [python, fastapi, golden-path, recommended]
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Service
      required: [name, description, owner, system]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase, digits and hyphens. Becomes the repo, image, Helm release and Kubernetes name.
          pattern: "^[a-z][a-z0-9-]{2,30}$"
          ui:autofocus: true
        description:
          title: Description
          type: string
          maxLength: 200
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        system:
          title: System
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
    - title: Operations and data
      required: [tier, dataClassification]
      properties:
        tier:
          title: Service tier (drives SLOs, alerting and DR)
          type: string
          default: tier-2
          enum: [tier-0, tier-1, tier-2, tier-3]
          enumNames: ["Tier 0 — critical", "Tier 1 — customer-facing", "Tier 2 — internal important", "Tier 3 — best effort"]
        dataClassification:
          title: Highest data classification handled
          type: string
          default: internal
          enum: [public, internal, confidential, restricted]
        needsDatabase:
          title: Needs a PostgreSQL database
          type: boolean
          default: false
        needsMessaging:
          title: Publishes or consumes Service Bus events
          type: boolean
          default: false

  steps:
    - id: service
      name: Generate service from skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          package: ${{ parameters.name | replace("-", "_") }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          team: ${{ parameters.owner | parseEntityRef | pick("name") }}
          system: ${{ parameters.system | parseEntityRef | pick("name") }}
          tier: ${{ parameters.tier }}
          dataClassification: ${{ parameters.dataClassification }}

    - id: gitops
      name: Generate GitOps values for dev
      action: fetch:template
      input:
        url: ./gitops-skeleton
        targetPath: ./gitops/gitops/workloads/dev/${{ parameters.owner | parseEntityRef | pick("name") }}/${{ parameters.name }}
        values:
          name: ${{ parameters.name }}
          team: ${{ parameters.owner | parseEntityRef | pick("name") }}
          system: ${{ parameters.system | parseEntityRef | pick("name") }}
          tier: ${{ parameters.tier }}
          dataClassification: ${{ parameters.dataClassification }}

    - id: publish
      name: Create repository
      action: publish:github
      input:
        sourcePath: ./service
        repoUrl: github.com?owner=harborline&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: internal
        protectDefaultBranch: true
        requireCodeOwnerReviews: true
        requiredApprovingReviewCount: 1
        dismissStaleReviews: true
        deleteBranchOnMerge: true
        allowMergeCommit: false
        allowRebaseMerge: false
        requiredStatusCheckContexts: ["ci / test", "image / build"]
        repoVariables:
          TEAM: ${{ parameters.owner | parseEntityRef | pick("name") }}
        topics: [harborline, golden-path, python]

    - id: gitops-pr
      name: Open GitOps PR in harborline-idp
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=harborline&repo=harborline-idp
        sourcePath: ./gitops
        branchName: onboard-${{ parameters.name }}
        title: "feat(gitops): onboard ${{ parameters.name }} to dev"
        description: |
          Generated by the **Python API service** template for `${{ parameters.owner }}`.
          Merge after the first image build in `harborline/${{ parameters.name }}` replaces the placeholder digest
          and the workload identity client ID is set (see the service README).
          ${{ "Database requested: add the database and identity in infra/terraform/stacks/workload-<team>." if parameters.needsDatabase else "" }}

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: GitOps pull request
        url: ${{ steps.gitops-pr.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
