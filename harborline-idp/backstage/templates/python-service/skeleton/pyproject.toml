[project]
name = "${{ values.name }}"
version = "0.1.0"
description = "${{ values.description }}"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "S", "UP", "SIM", "RUF"]
ignore = ["S101"]

[tool.coverage.run]
source = ["src"]
