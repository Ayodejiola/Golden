apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: harborline/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=${{ values.name }}
    harborline.io/tier: ${{ values.tier }}
    harborline.io/data-classification: ${{ values.dataClassification }}
  tags: [python, fastapi]
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.system }}
