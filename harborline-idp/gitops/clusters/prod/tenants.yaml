# One Application per tenant directory (gitops/tenants/<team>/overlays/prod).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/harborline/harborline-idp.git
        revision: main
        directories:
          - path: gitops/tenants/*
  template:
    metadata:
      name: "tenant-{{.path.basename}}"
      labels:
        harborline.io/layer: tenants
    spec:
      project: platform
      source:
        repoURL: https://github.com/harborline/harborline-idp.git
        targetRevision: main
        path: "gitops/tenants/{{.path.basename}}/overlays/prod"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: false   # never auto-delete a tenant namespace; offboarding is a runbook
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
