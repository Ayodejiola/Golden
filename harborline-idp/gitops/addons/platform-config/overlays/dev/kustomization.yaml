apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: NginxIngressController
      name: nginx-internal
    patch: |-
      - op: replace
        path: /spec/loadBalancerAnnotations/service.beta.kubernetes.io~1azure-load-balancer-ipv4
        value: 10.10.10.10
  - target:
      kind: SecretProviderClass
      name: otel-collector
    patch: |-
      - op: replace
        path: /spec/parameters/clientID
        value: 00000000-0000-0000-0000-0000000c0001
      - op: replace
        path: /spec/parameters/keyvaultName
        value: kv-hbl-plat-dev-cac01
