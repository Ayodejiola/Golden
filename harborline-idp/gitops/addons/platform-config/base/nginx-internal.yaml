# Internal-only managed NGINX (AKS app routing add-on). The only ingress class tenants may use.
# The App Gateway WAF forwards to this static private IP (Terraform output ingress_internal_ip).
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: nginx-internal
spec:
  ingressClassName: nginx-internal
  controllerNamePrefix: nginx-internal
  scaling:
    minReplicas: 2
    maxReplicas: 10
    threshold: balanced
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: snet-ilb
    service.beta.kubernetes.io/azure-load-balancer-ipv4: 0.0.0.0   # patched per environment
