apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    harborline.io/owner: sre
---
# Application Insights connection string for the collector, read with workload identity (no secret in Git).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: otel-collector
  namespace: observability
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: PATCHED_PER_ENV
    keyvaultName: PATCHED_PER_ENV
    tenantId: 00000000-0000-0000-0000-000000000000
    objects: |
      array:
        - |
          objectName: appinsights-connection-string
          objectType: secret
---
# Managed Prometheus scrape configs (Azure Monitor CRDs, not prometheus-operator).
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
    - port: metrics
      interval: 60s
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kyverno
  namespace: kyverno
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  podMetricsEndpoints:
    - port: metrics-port
      interval: 60s
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
