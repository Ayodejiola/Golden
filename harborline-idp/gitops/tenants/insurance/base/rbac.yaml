# Tenant engineers can read their namespace in every environment. Writes happen only through GitOps.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insurance-digital-view
  namespace: insurance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: 00000000-0000-0000-0000-00000000b001   # Entra group: grp-insurance-digital-engineers
