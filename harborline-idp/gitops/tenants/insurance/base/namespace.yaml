apiVersion: v1
kind: Namespace
metadata:
  name: insurance
  labels:
    harborline.io/tenant: "true"
    harborline.io/team: insurance-digital
    harborline.io/cost-center: CC-2040
    harborline.io/data-classification: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    harborline.io/backstage-group: group:default/insurance-digital
    harborline.io/oncall: insurance-digital-oncall
